<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책호스터이프로 책장</title>
<meta name="description" content="인스타그램 @kkariboy42 에 올린 추리·미스터리 게시물을 책별로 모아 둔 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --ink:#1d1a16; --muted:#6e665b; --line:#e3dccf;
  --accent:#8c2f23; --accent-soft:#f3e3dc; --spoil:#2b2622; --spoil-ink:#f1e9dc;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --surface:#1f1c17; --ink:#efe8dc; --muted:#a39a8c; --line:#342f28;
  --accent:#e0826f; --accent-soft:#3a241f; --spoil:#0e0d0b; --spoil-ink:#efe8dc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1f1c17; --ink:#efe8dc; --muted:#a39a8c; --line:#342f28;
  --accent:#e0826f; --accent-soft:#3a241f; --spoil:#0e0d0b; --spoil-ink:#efe8dc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Pretendard,system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:40px 0 20px;border-bottom:1px solid var(--line)}
.brand{font:800 clamp(26px,5vw,40px)/1.15 'Noto Serif KR',serif;letter-spacing:-.02em;margin:0;text-decoration:none;display:inline-block}
.brand small{display:block;font:600 13px/1.4 Pretendard,sans-serif;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.sub{color:var(--muted);margin:8px 0 18px;font-size:15px}
.search{width:100%;max-width:420px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
main{padding:28px 0 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px}
.book{text-decoration:none;display:block}
.cover{aspect-ratio:500/734;border-radius:4px 8px 8px 4px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font:800 18px/1.3 'Noto Serif KR',serif;padding:14px;text-align:center}
.book:hover .cover{transform:translateY(-3px)}
.cover{transition:transform .15s}
.book h3{font:600 15px/1.35 Pretendard,sans-serif;margin:10px 0 2px}
.meta{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:40px 0}
.back{display:inline-block;margin-bottom:20px;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--ink)}
.bookhead{display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:end;margin-bottom:32px}
.bookhead h2{font:800 clamp(24px,4.5vw,36px)/1.2 'Noto Serif KR',serif;margin:0 0 6px}
.bookhead .links a{font-size:14px;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.cols>*{min-width:0}
.post{overflow:hidden}
.embed iframe{max-width:100%!important;min-width:0!important}
.col h3{font:600 15px/1 Pretendard,sans-serif;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3d8b5a}
.col.spoil .dot{background:var(--accent)}
.col h3 .n{color:var(--muted);font-weight:400}
.gate{background:var(--spoil);color:var(--spoil-ink);border-radius:12px;padding:22px;text-align:center}
.gate p{margin:0 0 14px;font-size:15px}
.gate button{font:600 14px Pretendard,sans-serif;padding:10px 18px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.post .top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.chip{background:var(--accent-soft);color:var(--accent);font-weight:600;padding:2px 8px;border-radius:999px}
.post .hook{font-size:15px;margin:0 0 10px}
.embed{min-height:120px}
.embed .instagram-media{margin:0 auto!important;min-width:0!important;width:100%!important}
.none{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}
.gate .gt{font-weight:600;margin-bottom:4px}
.gate[hidden]{display:none}
.fold{display:block;margin:4px auto 0;font:600 14px Pretendard,sans-serif;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.own{font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 7px}
.note details summary{list-style:none;cursor:pointer}
.note details summary::-webkit-details-marker{display:none}
.note h4{font:800 18px/1.35 'Noto Serif KR',serif;margin:4px 0 6px}
.note .lead{margin:0 0 8px;color:var(--muted);font-size:15px}
.note .more{font-size:13px;color:var(--accent);font-weight:600}
.note details[open] .more{display:none}
.note .body{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-size:15px}
.note .body p{margin:0 0 12px}
.nl{padding-left:18px;margin:0 0 12px}.nl li{margin-bottom:10px}
.tl{list-style:none;padding:0;margin:0 0 12px 6px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pg{font:600 12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);white-space:nowrap}
.tg{font-size:11px;font-weight:600;color:var(--c)}
.tg::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.ln{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tl .tx{flex-basis:100%}
.pairs{list-style:none;padding:0;margin:0 0 12px}
.pairs li{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pairs li p{margin:4px 0 0}
.pairs .arrow{color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap;padding-top:2px}
.rel{list-style:none;padding:0;margin:0 0 12px}
.rel li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rel li span{color:var(--muted)}
.rel li span::before{content:"— "}.rel li span::after{content:" —"}
.rel li.hid em{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);margin-left:auto}
dialog.warn{max-width:min(420px,calc(100vw - 32px));border:none;border-radius:16px;padding:24px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
dialog.warn::backdrop{background:rgba(10,8,6,.7)}
dialog.warn h3{font:800 20px/1.3 'Noto Serif KR',serif;margin:6px 0 10px}
dialog.warn p{margin:0 0 10px;font-size:15px}
.wi{width:44px;height:44px;margin:0 auto!important;border-radius:50%;background:var(--accent);color:#fff;font:800 26px/44px Pretendard,sans-serif}
.wb{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.wb button{font:600 14px Pretendard,sans-serif;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.wb .go{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:720px){.pairs li{grid-template-columns:1fr}.pairs .arrow{padding:0}}
@media (max-width:720px){
  .cols{grid-template-columns:1fr}
  .bookhead{grid-template-columns:96px 1fr;gap:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#/"><small>@kkariboy42</small>책호스터이프로 책장</a>
  <p class="sub">인스타그램에 올린 추리·미스터리 게시물을 책별로 모았어요.</p>
  <input class="search" id="q" type="search" placeholder="책 제목이나 작가로 찾기" aria-label="책 찾기">
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="data.js"></script>
<script>
const D = window.SHELF, app = document.getElementById('app'), q = document.getElementById('q');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).replace(/\s/g,'').toLowerCase();
const byBook = {};
for (const p of D.posts) (byBook[p.book] ||= []).push(p);
const books = Object.keys(byBook).map(t => ({title:t, ...D.books[t], posts:byBook[t], last:byBook[t][0].date}))
  .sort((a,b) => b.last.localeCompare(a.last));
document.getElementById('foot').textContent = `책 ${books.length}권 · 게시물 ${D.posts.length}개 · ${D.updated} 갱신`;

const coverHtml = b => b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy">` : `<span class="ph">${esc(b.title)}</span>`;

function home() {
  const k = norm(q.value);
  const list = books.filter(b => !k || norm(b.title + (b.author||'')).includes(k));
  app.innerHTML = list.length ? `<div class="grid">${list.map(b => `
    <a class="book" href="#/book/${encodeURIComponent(b.title)}">
      <div class="cover">${coverHtml(b)}</div>
      <h3>${esc(b.title)}</h3>
      <div class="meta">${esc(b.author||'')}${b.author?' · ':''}게시물 ${b.posts.length}</div>
    </a>`).join('')}</div>` : `<p class="empty">「${esc(q.value)}」에 맞는 책이 없어요.</p>`;
}

function postHtml(p) {
  const url = `https://www.instagram.com/${p.video?'reel':'p'}/${p.code}/`;
  return `<article class="post">
    <div class="top"><span class="chip">${esc(p.kind)}</span><time>${p.date.replaceAll('-','.')}</time></div>
    <p class="hook">${esc(p.hook)}</p>
    <div class="embed" data-url="${url}"><a href="${url}" target="_blank" rel="noopener">인스타그램에서 보기 ↗</a></div>
  </article>`;
}

const TAG_COLOR = {'판':'var(--muted)','단서':'#3a8fb7','죽음':'#c0392b','밝혀짐':'#d4a017','뒤집힘':'#8e5cc4'};
function block(b) {
  if (b.type === 'text') return `<p>${esc(b.text)}</p>`;
  if (b.type === 'list') return `<ul class="nl">${b.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  if (b.type === 'timeline') return `<ol class="tl">${b.items.map(i => `
    <li><span class="pg">p.${esc(i.page)}</span><span class="tg" style="--c:${TAG_COLOR[i.tag]||'var(--muted)'}">${esc(i.tag||'')}</span>
    ${b.lanes && i.lane != null ? `<span class="ln">${esc(b.lanes[i.lane])}</span>` : ''}<span class="tx">${esc(i.text)}</span></li>`).join('')}</ol>`;
  if (b.type === 'pairs') return `<ol class="pairs">${[...b.items].sort((x, y) => (y.reveal - y.plant) - (x.reveal - x.plant)).map(i => `
    <li><div><span class="pg">p.${esc(i.plant)}</span> 심은 곳<p>${esc(i.plant_text)}</p></div>
    <div class="arrow" aria-hidden="true">→ ${i.reveal - i.plant > 0 ? `${i.reveal - i.plant}쪽 뒤` : ''}</div>
    <div><span class="pg">p.${esc(i.reveal)}</span> 드러난 곳<p>${esc(i.reveal_text)}</p></div></li>`).join('')}</ol>`;
  if (b.type === 'relations') return `<ul class="rel">${b.items.map(i => `
    <li class="${i.hidden?'hid':''}"><b>${esc(i.a)}</b><span>${esc(i.label)}</span><b>${esc(i.b)}</b>${i.hidden?'<em>숨겨진 선</em>':''}</li>`).join('')}</ul>`;
  return '';
}
function noteHtml(n) {
  return `<article class="post note">
    <div class="top"><span class="chip">${esc(n.kind)}</span><span class="own">사이트 전용</span></div>
    <details><summary><h4>${esc(n.title)}</h4>${n.lead ? `<p class="lead">${esc(n.lead)}</p>` : ''}<span class="more">펼쳐 읽기</span></summary>
      <div class="body">${n.blocks.map(block).join('')}</div></details>
  </article>`;
}

function book(title) {
  const b = books.find(x => x.title === title);
  if (!b) { app.innerHTML = `<a class="back" href="#/">← 책장으로</a><p class="empty">그 책은 아직 없어요.</p>`; return; }
  const safe = b.posts.filter(p => !p.spoiler), spoilPosts = b.posts.filter(p => p.spoiler);
  const notes = (D.notes && D.notes[b.title]) || [];
  const nSpoil = spoilPosts.length + notes.length;
  app.innerHTML = `<a class="back" href="#/">← 책장으로</a>
    <div class="bookhead"><div class="cover">${coverHtml(b)}</div><div>
      <h2>${esc(b.title)}</h2>
      <div class="meta">${esc([b.author, b.publisher].filter(Boolean).join(' · '))}</div>
      ${b.aladin ? `<div class="links"><a href="${esc(b.aladin)}" target="_blank" rel="noopener">알라딘에서 보기 ↗</a></div>` : ''}
    </div></div>
    <div class="cols">
      <section class="col"><h3><span class="dot"></span>스포 없음 <span class="n">${safe.length}</span></h3>
        ${safe.length ? safe.map(postHtml).join('') : '<p class="none">아직 없어요.</p>'}</section>
      <section class="col spoil"><h3><span class="dot"></span>스포 있음 <span class="n">${nSpoil}</span></h3>
        ${nSpoil ? `<div class="gate" id="gate"><p class="gt">결말·범인·트릭이 그대로 적혀 있어요</p>
            <p>책을 다 읽은 분만 펼쳐 주세요.</p><button type="button">펼치기</button></div>
          <div id="spoilList" hidden>${notes.map(noteHtml).join('')}${spoilPosts.map(postHtml).join('')}
            <button type="button" class="fold" id="fold">다시 접기</button></div>`
          : '<p class="none">아직 없어요.</p>'}</section>
    </div>`;
  const g = document.getElementById('gate');
  if (g) {
    const list = document.getElementById('spoilList');
    g.querySelector('button').onclick = () => warn(b.title, () => { g.hidden = true; list.hidden = false; watch(list); });
    document.getElementById('fold').onclick = () => { list.hidden = true; g.hidden = false; g.scrollIntoView({block:'center'}); };
  }
  watch(app.querySelector('.col'));
  window.scrollTo(0, 0);
}

// 스포 칸을 열기 전에 한 번 더 묻는다
function warn(title, ok) {
  const d = document.createElement('dialog');
  d.className = 'warn';
  d.innerHTML = `<p class="wi" aria-hidden="true">!</p><h3>결말까지 나옵니다</h3>
    <p>『${esc(title)}』의 범인, 트릭, 마지막 반전이 그대로 적혀 있어요. 한 번 보면 되돌릴 수 없어요.</p>
    <p>책을 끝까지 읽으셨나요?</p>
    <div class="wb"><button type="button" value="no" autofocus>아직이에요</button><button type="button" value="yes" class="go">다 읽었어요, 펼치기</button></div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => {
    const v = e.target.value;
    if (e.target === d || v === 'no') d.close();
    if (v === 'yes') { d.close(); ok(); }
  });
  d.addEventListener('close', () => d.remove());
  d.showModal();
}

// 인스타 임베드는 화면에 가까워질 때 붙인다 — 한 번에 수십 개를 띄우면 무겁다
let io;
function watch(root) {
  io ||= new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const u = e.target.dataset.url;
    e.target.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${u}" data-instgrm-version="14"><a href="${u}" target="_blank" rel="noopener">인스타그램에서 보기 ↗</a></blockquote>`;
    loadEmbed();
  }), {rootMargin:'600px'});
  root.querySelectorAll('.embed').forEach(el => io.observe(el));
}
let embedJs;
function loadEmbed() {
  if (window.instgrm) return window.instgrm.Embeds.process();
  if (embedJs) return;
  embedJs = document.createElement('script');
  embedJs.src = 'https://www.instagram.com/embed.js'; embedJs.async = true;
  embedJs.onload = () => window.instgrm && window.instgrm.Embeds.process();
  document.body.appendChild(embedJs);
}

function route() {
  const m = location.hash.match(/^#\/book\/(.+)$/);
  if (m) { q.parentElement.style.display = ''; book(decodeURIComponent(m[1])); }
  else home();
}
q.addEventListener('input', () => { if (location.hash.startsWith('#/book/')) location.hash = '#/'; else home(); });
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
